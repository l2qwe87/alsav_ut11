services:
  api-gateway:
    build:
      context: .
      dockerfile: src/Alsav.ApiGateway/Dockerfile
    container_name: alsav-api-gateway
    ports:
      - "5000:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      InternalApi__SecretKey: ${INTERNAL_API_SECRET:-demo-internal-secret}
      ConnectionStrings__GatewayDb: Data Source=/app/data/gateway.db
      BalanceCalculation__DefaultWarehouse: "Склад адресного хранения"
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped

volumes:
  gateway-data:
