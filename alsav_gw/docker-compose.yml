services:
  api-gateway:
    build:
      context: .
      dockerfile: src/Alsav.ApiGateway/Dockerfile
    container_name: alsav-api-gateway
    ports:
      - "5000:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OneCSettings__BaseUrl: http://onec-http:80
      OneCSettings__InternalSecret: ${ONEC_INTERNAL_SECRET:-demo-internal-secret}
      OneCSettings__SyncIntervalMinutes: "10"
      InternalApi__SecretKey: ${INTERNAL_API_SECRET:-demo-internal-secret}
      ReverseProxy__Clusters__onecCluster__Destinations__onec__Address: http://onec-http:80
    depends_on:
      - onec-http
    networks:
      - internal_net
    restart: unless-stopped

  onec-http:
    image: nginx:alpine
    container_name: alsav-onec-stub
    volumes:
      - ./onec-stub/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal_net
    restart: unless-stopped

networks:
  internal_net:
    driver: bridge
